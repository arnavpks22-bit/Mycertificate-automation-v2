
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Cinzel&family=Cormorant+Garamond&family=Great+Vibes&family=Libre+Baskerville&family=Lobster&family=Montserrat&family=Oswald&family=Pacifico&family=Parisienne&family=Poppins:wght@400;600&family=Roboto&family=Sacramento&family=Satisfy&family=Tangerine&display=swap">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #073f3b;
  background: #f2f8f6;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
  gap: 18px;
}

.panel {
  background: white;
  border: 1px solid #d5e7e1;
  border-radius: 14px;
  padding: 15px;
}

.preview {
  position: relative;
  width: 100%;
  aspect-ratio: 841.89 / 595.28;
  overflow: hidden;
  background: white;
  border: 1px solid #c9d7d2;
}

.preview img {
  width: 100%;
  height: 100%;
  display: block;
}

.name {
  position: absolute;
  transform: translate(-50%, -50%);
  text-align: center;
  white-space: nowrap;
  line-height: 1.2;
  pointer-events: none;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  max-height: 230px;
  overflow-y: auto;
  padding: 2px;
}

.font-card {
  background: #f9fcfb;
  border: 1px solid #d5e7e1;
  border-radius: 9px;
  padding: 8px;
  cursor: pointer;
  text-align: center;
  color: #073f3b;
}

.font-card.active {
  outline: 2px solid #137c72;
  background: #e3f4ee;
}

.sample {
  font-size: 23px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.font-label {
  font: 11px Arial;
  color: #496b64;
  margin-top: 4px;
}

label {
  font-weight: 600;
  font-size: 13px;
}

input[type="range"] {
  width: 100%;
  accent-color: #137c72;
  cursor: pointer;
}

input[type="text"] {
  width: 100%;
  padding: 9px;
  border: 1px solid #bcd2cb;
  border-radius: 8px;
  margin: 6px 0 12px;
}

input[type="color"] {
  height: 36px;
  width: 64px;
  border: 0;
  background: none;
  cursor: pointer;
}

.control {
  margin: 12px 0;
}

.control-head {
  display: flex;
  justify-content: space-between;
}

.value {
  font-size: 12px;
  color: #4e7770;
}

.small {
  font-size: 12px;
  color: #58736c;
}

.font-title {
  margin: 0 0 9px;
  font-size: 15px;
}

@media(max-width:680px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .gallery {
    max-height: 200px;
  }
}
</style>
</head>

<body>

<div class="layout">
  <section class="panel">
    <h3 class="font-title">Live certificate preview</h3>

    <div class="preview" id="preview">
      <img id="bg" alt="Certificate background">
      <div class="name" id="name">
        Sample Participant
      </div>
    </div>

    <p class="small">
      Drag a slider: the name changes instantly.
      Settings save when you release the slider.
    </p>

    <label for="sample">Preview name</label>
    <input
      id="sample"
      type="text"
      value="Sample Participant"
    >
  </section>

  <section class="panel">
    <h3 class="font-title">
      Choose a font — see its style
    </h3>

    <div class="gallery" id="gallery"></div>

    <div class="control">
      <div class="control-head">
        <label for="size">Font size</label>
        <span class="value" id="sizev"></span>
      </div>
      <input id="size" type="range" min="12" max="90" step="1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="x">Horizontal position</label>
        <span class="value" id="xv"></span>
      </div>
      <input id="x" type="range" min="5" max="95" step="1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="y">Vertical position</label>
        <span class="value" id="yv"></span>
      </div>
      <input id="y" type="range" min="5" max="95" step="1">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="width">Name width</label>
        <span class="value" id="widthv"></span>
      </div>
      <input id="width" type="range" min="20" max="90" step="1">
    </div>

    <div class="control">
      <label for="color">Text color</label>
      <div>
        <input id="color" type="color">
      </div>
    </div>
  </section>
</div>

<script>
const FONTS = [
  "Great Vibes",
  "Allura",
  "Alex Brush",
  "Parisienne",
  "Sacramento",
  "Tangerine",
  "Pacifico",
  "Lobster",
  "Satisfy",
  "Cinzel",
  "Cormorant Garamond",
  "Libre Baskerville",
  "Poppins",
  "Poppins SemiBold",
  "Montserrat",
  "Roboto",
  "Oswald",
  "Helvetica",
  "Helvetica Bold",
  "Times Roman"
];

const $ = id => document.getElementById(id);

let settings = {
  font: "Great Vibes",
  size: 42,
  x: 50,
  y: 50,
  width: 75,
  color: "#073f3b"
};

let sample = "Sample Participant";
let background = "";
let lastSent = "";

function family(font) {
  if (font === "Helvetica") return "Arial";
  if (font === "Helvetica Bold") return "Arial";
  if (font === "Times Roman") return "Times New Roman";
  if (font === "Poppins SemiBold") return "Poppins";
  return font;
}

function send() {
  const payload = JSON.stringify(settings);

  if (payload === lastSent) return;
  lastSent = payload;

  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: settings,
    dataType: "json"
  }, "*");
}

function updateHeight() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: Math.ceil(document.body.scrollHeight + 10)
  }, "*");
}

function paint() {
  const preview = $("preview");
  const name = $("name");
  const scale = preview.clientWidth / 841.89;

  name.textContent = sample;

  name.style.fontFamily =
    "'" + family(settings.font) + "', cursive, serif";

  name.style.fontWeight =
    settings.font === "Poppins SemiBold" ||
    settings.font === "Helvetica Bold"
      ? "bold"
      : "normal";

  name.style.fontSize = (settings.size * scale) + "px";
  name.style.left = settings.x + "%";
  name.style.top = settings.y + "%";
  name.style.color = settings.color;
  name.style.maxWidth = settings.width + "%";
  name.style.overflow = "hidden";

  for (const key of ["size", "x", "y", "width"]) {
    $(key + "v").textContent =
      settings[key] + (key === "size" ? " pt" : "%");
    $(key).value = settings[key];
  }

  $("color").value = settings.color;

  document.querySelectorAll(".font-card").forEach(card => {
    card.classList.toggle(
      "active",
      card.dataset.font === settings.font
    );
  });

  updateHeight();
}

function createGallery() {
  const gallery = $("gallery");
  gallery.innerHTML = "";

  for (const font of FONTS) {
    const card = document.createElement("button");

    card.type = "button";
    card.className = "font-card";
    card.dataset.font = font;

    const sampleText = document.createElement("div");
    sampleText.className = "sample";
    sampleText.textContent = "Alex Morgan";

    sampleText.style.fontFamily =
      "'" + family(font) + "', cursive, serif";

    if (
      font === "Poppins SemiBold" ||
      font === "Helvetica Bold"
    ) {
      sampleText.style.fontWeight = "bold";
    }

    const label = document.createElement("div");
    label.className = "font-label";
    label.textContent = font;

    card.append(sampleText, label);

    card.onclick = () => {
      settings.font = font;
      paint();
      send();
    };

    gallery.append(card);
  }
}

for (const key of ["size", "x", "y", "width"]) {
  $(key).addEventListener("input", event => {
    settings[key] = Number(event.target.value);
    paint();
  });

  $(key).addEventListener("change", send);
}

$("color").addEventListener("input", event => {
  settings.color = event.target.value;
  paint();
});

$("color").addEventListener("change", send);

$("sample").addEventListener("input", event => {
  sample = event.target.value || "Sample Participant";
  paint();
});

window.addEventListener("resize", paint);

window.addEventListener("message", event => {
  if (
    !event.data ||
    event.data.type !== "streamlit:render"
  ) {
    return;
  }

  const args = event.data.args || {};

  background = args.background || background;

  if (args.settings) {
    settings = {
      ...settings,
      ...args.settings
    };
    lastSent = JSON.stringify(settings);
  }

  if (
    args.sample &&
    document.activeElement !== $("sample")
  ) {
    sample = args.sample;
    $("sample").value = sample;
  }

  if (background) {
    $("bg").src = "data:image/png;base64," + background;
  }

  createGallery();
  paint();
});

createGallery();
paint();

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:componentReady",
  apiVersion: 1
}, "*");

updateHeight();
</script>

</body>
</html>
